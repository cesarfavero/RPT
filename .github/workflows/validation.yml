name: Validation contracts and CPU reference

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: validation/requirements-cpu.txt
      - name: Install CPU reference dependency
        run: python -m pip install -r validation/requirements-cpu.txt
      - name: Validate evaluation, splits, provenance and certificates
        run: python -m validation.run_validation --phase cpu --output-dir validation_runs/ci
      - name: Store exact test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-python-${{ matrix.python-version }}
          path: validation_runs/ci/

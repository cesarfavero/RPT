name: Validation contracts and CPU reference

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: validation/requirements-cpu.txt
      - name: Install CPU reference dependency
        run: python -m pip install -r validation/requirements-cpu.txt
      - name: Validate evaluation, splits, provenance and certificates
        run: |
          python -m validation.run_validation --phase cpu --output-dir validation_runs/ci
          tail -n 5 validation_runs/ci/unit_tests.log
      - name: Store exact test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: validation-python-${{ matrix.python-version }}
          path: validation_runs/ci/
